name: Build & Deploy (Windows + macOS + Steam)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pygame-ce pyinstaller pillow

      # ── Steam 도전과제 연동 (App ID 4718470) — 실패해도 빌드는 계속 ──
      - name: Install SteamworksPy (optional)
        continue-on-error: true
        run: |
          pip install git+https://github.com/philippj/SteamworksPy.git

      - name: Fetch SteamworksPy64.dll (optional)
        continue-on-error: true
        run: |
          if (-Not (Test-Path steam_libs\SteamworksPy64.dll)) {
            Invoke-WebRequest -Uri "https://github.com/philippj/SteamworksPy/releases/download/1.6.5/SteamworksPy64.dll" -OutFile steam_libs\SteamworksPy64.dll
            Write-Host "SteamworksPy64.dll downloaded"
          } else {
            Write-Host "SteamworksPy64.dll already in repo"
          }

      - name: Show environment info
        run: |
          python --version
          pip show pyinstaller pygame-ce pillow
          dir assets\steam

      - name: Convert PNG icon to ICO
        run: |
          python -c "
          from PIL import Image
          sizes = [256, 128, 64, 48, 32, 16]
          src = Image.open('assets/steam/icon_512.png').convert('RGBA')
          imgs = [src.resize((s, s), Image.LANCZOS) for s in sizes]
          imgs[0].save('assets/steam/icon.ico', format='ICO', append_images=imgs[1:])
          print('icon.ico generated OK')
          "

      - name: Build with PyInstaller
        run: |
          pyinstaller game.spec --clean --noconfirm --log-level WARN

      - name: Bundle Steam libraries
        run: |
          if (Test-Path steam_libs\steam_api64.dll) {
            Copy-Item steam_libs\*.dll dist\DungeonDoor\
            Write-Host "Steam libs bundled - achievements sync ENABLED"
          } else {
            Write-Host "steam_api64.dll not in steam_libs\ - shipping WITHOUT Steam sync (local achievements only)"
          }

      - name: Verify build
        run: |
          Get-ChildItem dist\DungeonDoor
          if (Test-Path dist\DungeonDoor\game.exe) {
            Write-Host "game.exe OK"
          } else {
            Write-Error "game.exe NOT FOUND"; exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDoor-Windows
          path: dist/DungeonDoor/
          retention-days: 30

      - name: Zip for Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path dist\DungeonDoor\* -DestinationPath DungeonDoor-${{ github.ref_name }}.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DungeonDoor-${{ github.ref_name }}.zip
          generate_release_notes: true

  # ─── macOS 빌드 (Apple Silicon) ──────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pygame-ce pyinstaller pillow

      # steamworks 파이썬 패키지가 있어야 spec이 번들에 포함(도전과제/리더보드).
      # 네이티브 dylib(SteamworksPy.dylib/libsteam_api.dylib)은 steam_libs/에 커밋됨.
      - name: Install SteamworksPy (optional)
        continue-on-error: true
        run: |
          pip install git+https://github.com/philippj/SteamworksPy.git
          echo "steam_libs:"; ls -la steam_libs/ || true

      - name: Generate icns icon
        run: |
          python -c "
          from PIL import Image
          Image.open('assets/steam/icon_512.png').save('assets/steam/icon.icns')
          print('icon.icns generated OK')
          "

      - name: Build with PyInstaller
        env:
          GAME_VERSION: ${{ github.ref_name }}
        run: |
          pyinstaller game.spec --clean --noconfirm --log-level WARN

      - name: Verify build
        run: |
          ls dist/
          test -x dist/DungeonDoor.app/Contents/MacOS/game && echo "DungeonDoor.app OK"

      # ditto: 실행 권한/심볼릭 링크 보존 zip (upload-artifact는 권한을 잃음)
      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/DungeonDoor.app DungeonDoor-mac-${{ github.ref_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DungeonDoor-macOS
          path: DungeonDoor-mac-${{ github.ref_name }}.zip
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DungeonDoor-mac-${{ github.ref_name }}.zip
          generate_release_notes: true

  # ─── Steam 자동 업로드 (secrets 설정 시에만 동작) ─────────────────────
  # 권장 secrets: STEAM_USERNAME, STEAM_PASSWORD, STEAM_SHARED_SECRET (TOTP 방식)
  # 폴백 secrets: STEAM_USERNAME, STEAM_CONFIG_VDF (docs/STEAM_DEPLOY.md 참고)
  # TOTP 방식은 매 실행마다 코드를 새로 생성하므로 토큰 만료/갱신이 없음.
  # 업로드 후 'beta' 브랜치에 자동 라이브 — default 브랜치 승격은
  # Valve 정책상 파트너 사이트에서 수동 (웹 2FA 필수)
  deploy-steam:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Check Steam credentials
        id: creds
        run: |
          if [ -n "${{ secrets.STEAM_SHARED_SECRET }}" ] && [ -n "${{ secrets.STEAM_PASSWORD }}" ]; then
            echo "ok=true"   >> "$GITHUB_OUTPUT"
            echo "mode=totp" >> "$GITHUB_OUTPUT"
            echo "인증 방식: TOTP (shared_secret 런타임 생성)"
          elif [ -n "${{ secrets.STEAM_CONFIG_VDF }}" ]; then
            echo "ok=true"  >> "$GITHUB_OUTPUT"
            echo "mode=vdf" >> "$GITHUB_OUTPUT"
            echo "인증 방식: config.vdf (⚠ 토큰 회전으로 만료될 수 있음 — TOTP 방식 권장)"
          else
            echo "ok=false"  >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Steam credentials 없음 — Steam 업로드 건너뜀"
          fi

      - name: Download Windows build
        if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DungeonDoor-Windows
          path: build/windows

      - name: Download macOS build
        if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        with:
          name: DungeonDoor-macOS
          path: mac_zip

      - name: Unpack macOS app (권한 보존)
        if: steps.creds.outputs.ok == 'true'
        run: |
          mkdir -p build/macos
          unzip -q mac_zip/DungeonDoor-mac-${{ github.ref_name }}.zip -d build/macos
          chmod +x build/macos/DungeonDoor.app/Contents/MacOS/game
          ls -la build/macos/DungeonDoor.app/Contents/MacOS/

      # 매 실행마다 30초 유효 Steam Guard 코드를 shared_secret으로 생성 —
      # config.vdf처럼 저장된 토큰이 없으므로 만료/수동 갱신이 원천적으로 없다
      - name: Generate Steam Guard code (TOTP)
        if: steps.creds.outputs.mode == 'totp'
        id: steam-totp
        uses: andriivitiv/steam-totp@v1
        with:
          shared_secret: ${{ secrets.STEAM_SHARED_SECRET }}

      - name: Deploy to Steam (App 4718470)
        if: steps.creds.outputs.ok == 'true'
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          password: ${{ secrets.STEAM_PASSWORD }}
          # totp가 있으면 configVdf는 무시됨 (steam-deploy 동작)
          totp: ${{ steps.steam-totp.outputs.code }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: 4718470
          buildDescription: ${{ github.ref_name }} (auto)
          rootPath: build
          depot1Path: windows
          depot2Path: macos
          releaseBranch: beta
